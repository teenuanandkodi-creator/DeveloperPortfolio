{% extends "base.html" %}

{% block title %}

Login - ELMS

{% endblock %}


{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1 class="login-title">

            Welcome Back

        </h1>

        <p class="login-subtitle">

            Please login to your account

        </p>


        <form method="POST" action="/login">

            <div class="mb-3">

                <label for="username">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="mb-3">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                Login

            </button>

        </form>


        {% if error %}

        <div class="alert alert-danger mt-3">

            {{ error }}

        </div>

        {% endif %}


        <div class="demo-credentials">

            <strong>Demo Credentials</strong>

            <p class="mb-1">

                <strong>Admin:</strong>
                admin / admin123

            </p>

            <p class="mb-0">

                <strong>Employee:</strong>
                employee / employee123

            </p>

        </div>

    </div>

</div>

{% endblock %}
