<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Employee Leave Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">ELMS</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/employees">Employees</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/leave">Leave</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/add_employee">Add Employee</a>
                </li>

            </ul>

            {% if session.get("user_id") %}
                <li class="nav-item">
                    <span class="nav-link"> Welcome, {{ session.get("username") }}</span>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger" href="/logout"> Logout </a>
                </li>
            {% else %}

<li class="nav-item">

    <a
        class="nav-link"
        href="/login">

        Login

    </a>

</li>

{% endif %}
        </div>

    </div>

</nav>

<div class="container mt-5">

    {% block content %}

    {% endblock %}

</div>

<footer class="text-center mt-5 mb-3">

    <hr>

    <p>

        © 2026 Employee Leave Management System

    </p>

</footer>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
