{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">

Add Employee

</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Employee ID

</label>

<input
type="text"
name="employee_id"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Employee Name

</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Department

</label>

<input
type="text"
name="department"
class="form-control"
required>

</div>

<button
class="btn btn-success">

Add Employee

</button>

<a
href="/employees"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}
