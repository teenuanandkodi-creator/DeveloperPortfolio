{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
Edit Employee
</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Employee ID
</label>

<input
type="text"
name="employee_id"
class="form-control"
value="{{ employee['employee_id'] }}"
required>

</div>

<div class="mb-3">

<label class="form-label">
Name
</label>

<input
type="text"
name="name"
class="form-control"
value="{{ employee['name'] }}"
required>

</div>

<div class="mb-3">

<label class="form-label">
Department
</label>

<input
type="text"
name="department"
class="form-control"
value="{{ employee['department'] }}"
required>

</div>

<button
class="btn btn-warning"
type="submit">

Update Employee

</button>

</form>

{% endblock %}
