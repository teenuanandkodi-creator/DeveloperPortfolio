{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">

Employees

</h2>
<a
href="/add_employee"
class="btn btn-primary mb-3">

+ Add Employee

</a>

<table class="table table-striped table-hover">

    <thead class="table-primary">

        <tr>

            <th>Employee ID</th>

            <th>Name</th>

            <th>Department</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody>

        {% for employee in employees %}

        <tr>

            <td>{{ employee["employee_id"] }}</td>

            <td>{{ employee["name"] }}</td>

            <td>{{ employee["department"] }}</td>

            <td>
                <a href="/edit/{{ employee['id'] }}" class="btn btn-warning btn-sm"> Edit</a>
                <a href="/delete/{{ employee['id'] }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this employee?');"> Delete </a>
            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
